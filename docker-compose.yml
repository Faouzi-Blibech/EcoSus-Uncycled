# Local stack for the pitch demo: the game server and the eco photo verifier on one PC.
#   .\start-demo.ps1                 -> finds this PC's Wi-Fi address and starts both
#   docker compose up -d --build     -> same, without the address for phones (links use the request host)
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5000:8080"          # the game's default address is ws://localhost:5000/ws
    restart: unless-stopped

  verifier:
    build:
      context: .
      dockerfile: ecoverify/Dockerfile
    ports:
      - "8000:8000"          # phones on the same wifi use http://<this PC's LAN IP>:8000
    volumes:
      - eco-data:/data       # streaks and submissions survive restarts
    environment:
      ECO_DB: /data/eco_verify.db
      # Local testing only: the browser tester's webcam shots carry no EXIF capture time.
      # Remove this line on the demo server; clients can never turn the check off themselves.
      UNCYCLED_DEV_SKIP_EXIF: "1"
      # Address put in scan links and QR codes, so a phone can open them: start-demo.ps1 sets it to
      # http://<this PC's Wi-Fi address>:8000 (or set it to a tunnel URL). Empty: the request's own host.
      ECO_PUBLIC_URL: ${ECO_PUBLIC_URL:-}
      # ECO_DISABLE_CLIP: "1"   # uncomment to run YOLO only (faster start, less RAM)
      # ECO_DISABLE_TACO: "1"   # uncomment to ignore the TACO litter model
    restart: unless-stopped

volumes:
  eco-data:
