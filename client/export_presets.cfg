variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>\n/* Cloudflare Pages takes files up to 25 MB, so deploy/build-web.ps1 stores the engine (.wasm) and the\n   game data (.pck) gzipped as <name>.gz. This unzips them in the browser before Godot reads them.\n   No .gz next to the page (a plain LAN build): the original files load as usual. */\n(function () {\n  var realFetch = window.fetch.bind(window);\n  var big = /\\.(wasm|pck)(\\?.*)?$/;\n  window.fetch = function (input, init) {\n    var url = typeof input === 'string' ? input : ((input && input.url) || '');\n    var m = big.exec(url);\n    if (!m || typeof DecompressionStream === 'undefined') { return realFetch(input, init); }\n    var type = m[1] === 'wasm' ? 'application/wasm' : 'application/octet-stream';\n    return realFetch(url.replace(big, '.$1.gz$2'), init).then(function (r) {\n      if (!r.ok) { return realFetch(input, init); }\n      return r.arrayBuffer().then(function (buf) {\n        var head = new Uint8Array(buf, 0, Math.min(2, buf.byteLength));\n        if (head[0] !== 0x1f || head[1] !== 0x8b) { return new Response(buf, { headers: { 'Content-Type': type } }); }\n        var plain = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));\n        return new Response(plain, { headers: { 'Content-Type': type } });\n      });\n    });\n  };\n})();\n</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false

