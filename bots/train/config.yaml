# Trainer configuration. Reward weights are passed to the host as --rw-* flags (spec 5.4).
host:
  exe: ../.build/train-win/Uncycled.Train.exe   # relative to this file
  content_dir: ../../content                    # relative to this file
  matches: 16
  threads: null                                 # null = host default (cores - 2)

rewards:                  # v2 values; the v1 task, hit and dump weights are gone (no v1 event fires)
  win: 1.0
  report: 0.1             # Cleaner: own report leads to a Trasher ejection
  ejectright: 0.1         # Cleaner: a Trasher is voted out
  ejectwrong: -0.1        # Cleaner: a Cleaner is voted out
  deliver: 0.1            # Cleaner: per bag delivered
  spot: 0.02              # Cleaner: per spot cleaned
  fix: 0.05               # Cleaner: holder of a machine fix that completes
  heal: 0.05              # Cleaner: heals someone
  out: -0.1               # Cleaner: put out by gas or virus
  ejected: -0.3           # Trasher: voted out
  cleanerout: 0.1         # Trasher: a Cleaner is voted out
  repollute: 0.05         # Trasher: re-pollute nobody saw
  victim: 0.1             # Trasher: Cleaner put out by own gas or virus
  jam: 0.02               # Trasher: machine sabotage

ppo:
  device: auto            # auto = cuda if available, else cpu
  n_steps: 128            # per agent per rollout
  batch_size: 2048
  n_epochs: 4
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch:
    pi: [256, 256]
    vf: [256, 256]

checkpoint_every: 100000   # env steps (one step = one decision of one agent)
seed: 1
